// Compose Compiler stability hints.
//
// Listed classes are considered stable by the Compose Compiler, even if their
// JVM type signatures alone wouldn't let it infer that. This unlocks
// skippability for @Composable functions that take these types as parameters
// without relying on @Immutable propagating from the upstream library.
//
// What we deliberately do NOT list:
//   - kotlin.collections.List / Map / Set — these are read-only by interface,
//     but the project's contract (ARCHITECTURE.md) is that any @Composable taking a
//     collection must take a Persistent* variant. Treating the platform types
//     as stable here would silently mask passing a mutable list at a call site.
//   - Repository / ViewModel types — they hold mutable state by design.

// kotlinx.collections.immutable — used in 24+ files as the canonical
// collection type reaching Compose. Library already ships @Immutable on these,
// but listing them explicitly here makes the contract resilient to any future
// annotation reshuffling upstream.
kotlinx.collections.immutable.PersistentList
kotlinx.collections.immutable.PersistentMap
kotlinx.collections.immutable.PersistentSet
kotlinx.collections.immutable.ImmutableList
kotlinx.collections.immutable.ImmutableMap
kotlinx.collections.immutable.ImmutableSet

// kotlinx.serialization runtime types reach Compose through DataStore-backed
// preference values. They're value-typed and immutable.
kotlinx.serialization.json.JsonElement
