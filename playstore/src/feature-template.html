<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <title>{{title_plain}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/styles.css">
</head>
<body class="feature">
  <div class="feature-canvas">
    <div class="feature-glow" aria-hidden="true"></div>
    <div class="feature-grain" aria-hidden="true"></div>

    <div class="feature-icon" aria-hidden="true">
      <img src="../../listing/icon-1024.png" alt="">
    </div>

    <div class="feature-text">
      <h1 class="feature-title">{{title}}</h1>
      <span class="feature-divider" aria-hidden="true"></span>
      <p class="feature-subtitle">{{subtitle}}</p>
    </div>
  </div>
</body>
</html>
