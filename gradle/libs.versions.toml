[versions]
agp = "9.2.0"
kotlin = "2.3.10"
ksp = "2.3.10-2.0.0"
composeBom = "2026.04.01"
# material3 explicitly pinned to the Expressive alpha (released 2026-05-06).
# The April BOM ships material3 1.4.0 stable, which lacks MaterialShapes,
# LoadingIndicator, FloatingToolbar, ButtonGroup, FlexibleTopAppBar and the
# expressive motion scheme — i.e. the entire surface this app's design refresh
# is built on. We override the BOM-supplied version explicitly (Google's
# documented escape hatch for ranged early-adopt of material3 ahead of the
# next BOM cut). When the next BOM ships >=1.5.0, drop this override.
composeMaterial3 = "1.5.0-alpha19"
# graphics-shapes powers the Morph API used for shape interpolation between
# MaterialShapes presets (e.g. Square <-> Cookie9Sided on reaction toggle).
# Pulled transitively by material3 1.5.x, but declaring it explicitly lets the
# theme module reference Morph / RoundedPolygon directly without depending on
# material3's internal export surface.
graphicsShapes = "1.1.0"
# androidx.navigation3 — modern back-stack-as-state navigation (stable 1.1.2, May 2026).
# Not managed by the Compose BOM (separate group), so it coexists with the pinned
# material3 alpha. Shared-element / container-transform comes from compose-animation
# (BOM-managed) via SharedTransitionLayout; nav3 supplies NavDisplay + entry-scoping.
navigation3 = "1.1.2"
coreKtx = "1.16.0"
appcompat = "1.7.0"
activityCompose = "1.10.0"
# androidx.browser — Custom Tabs for the Safety-section external links. 1.9+ raised
# minSdk to 23 (we're 26) and added Auth Tab / ephemeral-tab APIs; the basic
# CustomTabsIntent launchUrl path this app uses is unchanged from 1.8.
browser = "1.10.0"
# lifecycle 2.10.0 — aligned with lifecycle-viewmodel-navigation3 (entry-scoped
# ViewModelStore for Nav3). All lifecycle-* artifacts share this version.
lifecycle = "2.10.0"
coroutines = "1.10.1"
serialization = "1.7.3"
# java-diff-utils — text-diff for the post-archive edit-history snapshots.
diffUtils = "4.12"
datastore = "1.2.0"
coil = "3.3.0"
splashscreen = "1.2.0"
media3 = "1.10.0"
immutable = "0.4.0"
leakcanary = "2.14"
lottie = "6.6.0"
jsoup = "1.22.2"
okhttp = "4.12.0"
sqldelight = "2.3.2"
junit5 = "5.11.4"
junitPlatform = "1.11.4"
kotlinxCoroutinesTest = "1.10.1"
benchmark = "1.5.0-alpha05"
profileinstaller = "1.4.1"
uiautomator = "2.4.0-beta02"
androidxTestExt = "1.3.0"
# detekt 1.23.7 — last 1.23.x release on the 1.x line, K2 not officially supported
# by detekt's embedded compiler yet (tracked in detekt/detekt#6198) but the engine
# still parses Kotlin 2.x sources via the bundled K1 frontend with a small number
# of known false-negatives on context receivers / multidollar strings — acceptable
# trade-off until 2.0.0-alpha lands. Re-evaluate when detekt 2.x ships.
detekt = "1.23.7"
# nlopez/compose-rules — community Compose-specific lint rules (Modifier ordering,
# stable params, lambda parameter naming/position, content-emitter return values,
# etc.). 0.4.22 is the latest 0.4.x release; tracks detekt 1.23.x.
detektRulesCompose = "0.4.22"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }
compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }

androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# protobuf format shares the serialization version — keep them locked to the same line.
kotlinx-serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version.ref = "serialization" }

androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
java-diff-utils = { group = "io.github.java-diff-utils", name = "java-diff-utils", version.ref = "diffUtils" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "immutable" }

leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }

jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# SQLDelight 2.x — typed SQL DAO for the anonymous web-mode database (web.db).
# Android driver provides AndroidSqliteDriver wrapping AOSP SQLiteOpenHelper;
# coroutines-extensions exposes asFlow()/mapToList() helpers for StateFlow plumbing.
sqldelight-android-driver = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
# JVM SQLite driver — unit tests only (archive DB schema + migration tests). Shares
# the runtime SQLDelight version so test fidelity matches production migration semantics.
sqldelight-sqlite-driver = { group = "app.cash.sqldelight", name = "sqlite-driver", version.ref = "sqldelight" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }

androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# Detekt Compose rules — loaded into the detekt classpath via `detektPlugins(...)`
# in app/build.gradle.kts. Not an `implementation` dep — it never reaches the APK.
detekt-rules-compose = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "detektRulesCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
