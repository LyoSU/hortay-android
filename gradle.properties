# Update these when the hosted pages move without touching the build script.
HORTAY_CHILD_SAFETY_POLICY_URL=https://telegra.ph/Child-Safety-Standards-05-12
HORTAY_PRIVACY_POLICY_URL=https://telegra.ph/Privacy-Policy--Hortay-05-01
