# CI — the pre-commit gate ARCHITECTURE.md describes (lintRelease for the
# MissingTranslation parity check, detekt for Compose-stability + Kotlin smells,
# JVM unit tests), enforced on every push/PR to main so nothing merges unchecked.
#
# The long pole is TDLib: `org.drinkless.tdlib.{TdApi,Client}.java` are gitignored
# and produced by scripts/update-tdlib.sh (Docker, ~20-30 min). :app won't compile
# without them, so the first run builds TDLib and every later run restores it from
# cache keyed on scripts/tdlib-version.txt — the cache only misses on a TDLib bump,
# which is already its own dedicated commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run — TDLib builds are
# expensive, don't pay for stale ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Backstop against a runaway build (Docker TDLib) or a hung test — runTest's
    # own 60 s timeout normally fires first, this just caps the worst case.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Restore the Docker-built TDLib bindings + native libs. Keyed on the pinned
      # version file, so a `chore(tdlib): bump` invalidates it and nothing else does.
      # Split restore/save (not the all-in-one cache action) because its implicit
      # post-step save proved unreliable here — the explicit save below runs as a
      # foreground step right after the build, so it can't be skipped.
      - name: Restore TDLib artifacts
        id: tdlib-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            libtdlib/src/main/java/org/drinkless/tdlib/TdApi.java
            libtdlib/src/main/java/org/drinkless/tdlib/Client.java
            libtdlib/src/main/jniLibs
          key: tdlib-${{ hashFiles('scripts/tdlib-version.txt') }}

      # Only build TDLib on a cache miss. arm64-v8a alone (release ABI) + no debug
      # zip — the gates here never need x86_64 or unstripped symbols.
      - name: Build TDLib (cache miss only)
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        env:
          ABIS: arm64-v8a
          KEEP_DEBUG: "0"
        run: |
          sha=$(grep '^TDLIB_SHA=' scripts/tdlib-version.txt | cut -d= -f2)
          echo "Building TDLib at pinned SHA $sha"
          ./scripts/update-tdlib.sh "$sha"

      # Persist the freshly-built artifacts immediately (foreground), so the next
      # run on the same TDLib pin restores in seconds instead of rebuilding.
      # Key off the RESTORE step's primary key, NOT a fresh hashFiles(): the build
      # rewrites scripts/tdlib-version.txt (new UPDATED_AT timestamp), so recomputing
      # the hash here would save under a key the next run's restore never looks up.
      - name: Save TDLib artifacts
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            libtdlib/src/main/java/org/drinkless/tdlib/TdApi.java
            libtdlib/src/main/java/org/drinkless/tdlib/Client.java
            libtdlib/src/main/jniLibs
          key: ${{ steps.tdlib-cache.outputs.cache-primary-key }}

      # lintRelease schedules packageReleaseResources, which trips the build's
      # fail-fast guard against release packaging without signing config. A
      # throwaway keystore (never the real signing identity) mirrors the local
      # dev setup so the documented lintRelease gate can run. keystore.properties
      # is gitignored; this one is scoped to the runner and discarded with it.
      - name: Generate throwaway release keystore
        run: |
          keytool -genkeypair -alias ci -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=CI,OU=CI,O=CI,L=CI,ST=CI,C=US" \
            -keystore "$RUNNER_TEMP/ci.jks" -storepass cipassword -keypass cipassword
          {
            echo "storeFile=$RUNNER_TEMP/ci.jks"
            echo "storePassword=cipassword"
            echo "keyAlias=ci"
            echo "keyPassword=cipassword"
          } > keystore.properties

      # Static analysis and unit tests first (no native packaging, fast feedback),
      # then the release-lint translation gate. lintRelease pulls :libwebm's
      # RelWithDebInfo CMake build, which needs the gitignored ffmpeg static libs
      # (built by scripts/build-ffmpeg.sh, not in CI). lint analyses code/resources,
      # not the .so, so we exclude that native task — it has no bearing on the
      # MissingTranslation/lint-vital findings this gate exists to enforce.
      - name: detekt + unit tests + lintRelease
        run: >
          ./gradlew :app:detekt :app:testDebugUnitTest :app:lintRelease
          -x ':libwebm:buildCMakeRelWithDebInfo[arm64-v8a]'
          --no-daemon --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-release.*
            app/build/reports/tests/
          if-no-files-found: ignore
