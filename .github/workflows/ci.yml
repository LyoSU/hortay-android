# CI — the pre-commit gate ARCHITECTURE.md describes (lintRelease for the
# MissingTranslation parity check, detekt for Compose-stability + Kotlin smells,
# JVM unit tests), enforced on every push/PR to main so nothing merges unchecked.
#
# TDLib (org.drinkless.tdlib.{TdApi,Client}.java + native libs) is gitignored and
# produced by scripts/update-tdlib.sh; the setup-tdlib composite restores it from
# cache or builds it on a miss (only on a TDLib bump). Runs with no real secrets so
# it is safe on fork PRs — release signing lives in release.yml / beta.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run — TDLib builds are
# expensive, don't pay for stale ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Backstop against a runaway build (Docker TDLib) or a hung test — runTest's
    # own 60 s timeout normally fires first, this just caps the worst case.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up TDLib
        uses: ./.github/actions/setup-tdlib
        with:
          abis: arm64-v8a

      # lintRelease schedules packageReleaseResources, which trips the build's
      # fail-fast guard against release packaging without signing config. A
      # throwaway keystore (never the real signing identity) mirrors the local
      # dev setup so the documented lintRelease gate can run. keystore.properties
      # is gitignored; this one is scoped to the runner and discarded with it.
      - name: Generate throwaway release keystore
        run: |
          keytool -genkeypair -alias ci -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=CI,OU=CI,O=CI,L=CI,ST=CI,C=US" \
            -keystore "$RUNNER_TEMP/ci.jks" -storepass cipassword -keypass cipassword
          {
            echo "storeFile=$RUNNER_TEMP/ci.jks"
            echo "storePassword=cipassword"
            echo "keyAlias=ci"
            echo "keyPassword=cipassword"
          } > keystore.properties

      - name: Pre-resolve dependencies
        uses: ./.github/actions/prefetch-deps
        with:
          configuration: releaseRuntimeClasspath

      # Static analysis and unit tests first (no native packaging, fast feedback),
      # then the release-lint translation gate. lintRelease pulls :libwebm's
      # RelWithDebInfo CMake build, which needs the gitignored ffmpeg static libs
      # (built by scripts/build-ffmpeg.sh, not in CI). lint analyses code/resources,
      # not the .so, so we exclude that native task — it has no bearing on the
      # MissingTranslation/lint-vital findings this gate exists to enforce.
      #
      # Unit tests stay on debug: AGP 9 creates host tests only for the test build
      # type, so there is no release unit-test variant to share lintRelease's compile.
      - name: detekt + unit tests + lintRelease
        run: >
          ./gradlew :app:detekt :app:testDebugUnitTest :app:lintRelease
          -x ':libwebm:buildCMakeRelWithDebInfo[arm64-v8a]'
          --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-release.*
            app/build/reports/tests/
          if-no-files-found: ignore
